        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f0f4f8; /* Light gray background */
        }
        /* Custom scrollbar style for aesthetics */
        .custom-scroll::-webkit-scrollbar {
            height: 8px; /* For horizontal scroll in schedule box */
            width: 8px; /* For general vertical scroll */
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: #312e81; /* primary-indigo */
            border-radius: 10px;
        }
        /* schedule-text is now for the single-day view */
        .schedule-text {
            white-space: pre-wrap;
            word-break: break-word;
        }
        /* Style for the search input wrapper to contain the icon */
        .search-wrapper {
            position: relative;
        }
        .search-icon {
            position: absolute;
            left: 1rem; /* Right aligned in RTL */
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af; /* Gray-400 */
            pointer-events: none; /* Allows clicks to pass through to the input */
        }
        /* Custom class for the weekly schedule grid */
        .weekly-schedule-grid {
            display: grid;
            grid-template-columns: 1fr 2fr; /* Day on left, Time on right */
            gap: 0;
        }
        .grid-header {
            background-color: #312e81;
            color: white;
            padding: 0.5rem 0.75rem;
            font-weight: bold;
        }
        .grid-day {
            background-color: #ecfdf5; /* light-blue */
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid #d1d5db; /* gray-300 */
            font-weight: 600;
        }
        .grid-time {
            background-color: #f9fafb; /* light gray */
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid #d1d5db;
        }
    </style>

            { specialty: 'قلب كبار', emoji: '🫀', fee: '350', doctor: 'عبدالفتاح سيد (استشاري قلب والاوعيه)', schedule: 'الأحد، الثلاثاء: 1 م - 5 م', notes: 'حجز مسبق 9 ص - 11 ص' },
            { specialty: 'قلب كبار', emoji: '🫀', fee: '350', doctor: 'محمود راضي (استشاري قلب والاوعيه)', schedule: 'الأربعاء: 1 م - 3 م', notes: 'حجز مسبق 9 ص - 11 ص' },

        ];

        const daysOfWeek = ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'];
        
        // selectedDay is always set to the current day on load, as per the user's latest requirement.
        let selectedDay = 'all'; 

        // --- Utility Functions ---

        // Function to determine the current day in Arabic
        function getCurrentDayInArabic() {
            const dayIndex = new Date().getDay(); // 0 for Sunday, 6 for Saturday
            // 0: الأحد, 1: الإثنين, ..., 6: السبت
            const orderedDays = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            return orderedDays[dayIndex];
        }

        // Extracts all unique specialties for the dropdown and prioritizes them
        function getUniqueSpecialties() {
            const allSpecialties = [...new Set(clinicsData.map(c => c.specialty))];
            
            const prioritizedOrder = [
                'عيادات الأطفال', 
                'نساء و توليد', 
                'جراحة أطفال', 
                'أسنان أطفال'
            ];

            const prioritizedSpecialties = [];
            const otherSpecialties = [];

            allSpecialties.forEach(specialty => {
                if (prioritizedOrder.includes(specialty)) {
                    prioritizedSpecialties.push(specialty);
                } else {
                    otherSpecialties.push(specialty);
                }
            });
            
            // Sort prioritized specialties based on the fixed order
            prioritizedSpecialties.sort((a, b) => prioritizedOrder.indexOf(a) - prioritizedOrder.indexOf(b));
            
            // Sort the rest alphabetically
            otherSpecialties.sort();

            // Combine and return
            return [...prioritizedSpecialties, ...otherSpecialties];
        }

        /**
         * Normalizes an Arabic string for search comparison:
         * 1. Performs Unicode normalization (NFC).
         * 2. Removes diacritics (Harakat).
         * 3. Handles common Arabic character variations (Alif, Ta Marbuta, Ya).
         * 4. Removes all non-alphabetic/numeric characters (including spaces, punctuation, titles).
         */
        function normalizeArabicSearch(str) {
            if (!str) return '';
            
            let normalized = str;
            
            // 1. Convert to a standard Unicode form (NFC)
            normalized = normalized.normalize("NFC");

            // 2. Remove titles in parentheses and leading/trailing spaces
            normalized = normalized.replace(/\s*\([^)]*\)\s*/g, '').trim();

            // 3. Remove all Arabic diacritics (Harakat: Fatha, Kasra, Damma, Sukun, etc.)
            normalized = normalized.replace(/[\u064B-\u0652]/g, "");

            // 4. Normalize common Arabic character variations:
            // Normalize Alif variations (أ, إ, آ) to simple Alif (ا)
            normalized = normalized.replace(/[أإآ]/g, 'ا');
            // Normalize Ta Marbuta (ة) to Ha (ه)
            normalized = normalized.replace(/ة/g, 'ه');
            // Normalize Ya (ى) to Alif Maksura (ي)
            normalized = normalized.replace(/ى/g, 'ي');

            // 5. Remove all non-alphabetic characters (including spaces, dots, and Arabic commas)
            // This is the most aggressive step to ensure 'عبد الغفار' == 'عبدالغفار'
            normalized = normalized.replace(/[\s.،`~!@#$%^&*()_|+\-=?;:'",.<>\{\}\[\]\\\/]/gi, '');
            
            // Convert to lowercase (good practice, though Arabic case is mostly irrelevant)
            normalized = normalized.toLowerCase();

            return normalized;
        }

        /**
         * Parses the schedule string to convert it into a standardized array of day/time objects for all 7 days.
         * This function is crucial for the enhanced weekly display.
         * @param {string} fullSchedule - The complete schedule string (e.g., 'السبت، الإثنين، الثلاثاء: 3 م - 9 م، الأربعاء: 10 ص - 12 م').
         * @returns {Array<object>} - Array of { day: string, time: string } for all 7 days.
         */
        function parseScheduleToDays(fullSchedule) {
            const weeklyMap = {};
            daysOfWeek.forEach(day => weeklyMap[day] = 'لا يوجد موعد.');

            // Regex to find all blocks: (Days list) : (Time range)
            // It searches for groups of days/text followed by a colon and the time range up to the next Arabic comma or end of string.
            const combinedEntryRegex = /([\u0621-\u064A\s،\w\d]+):\s*([^،]+)/g;
            let match;

            while ((match = combinedEntryRegex.exec(fullSchedule)) !== null) {
                const daysListStr = match[1].trim(); // e.g., "السبت، الإثنين، الثلاثاء"
                const timeRange = match[2].trim(); // e.g., "3 م - 9 م"

                // Split the days list by Arabic comma and filter empty/whitespace entries
                const currentDays = daysListStr.split('،').map(d => d.trim()).filter(d => d.length > 0);

                currentDays.forEach(day => {
                    // Only update if the day is a valid day of the week
                    if (daysOfWeek.includes(day)) {
                        weeklyMap[day] = timeRange;
                    }
                });
            }

            // Convert map back to an ordered array
            return daysOfWeek.map(day => ({
                day: day,
                time: weeklyMap[day]
            }));
        }

        /**
         * Parses the schedule string to see if a specific day is included.
         *
         * @param {string} schedule - The complete schedule string.
         * @param {string} day - The Arabic name of the day (e.g., 'الأحد').
         * @returns {boolean}
         */
        function hasDay(schedule, day) {
            if (day === 'all') return true;
            
            // Reusing the robust parsing function to check if the day has a valid time entry
            const parsedSchedule = parseScheduleToDays(schedule);
            const dayEntry = parsedSchedule.find(entry => entry.day === day);
            
            return dayEntry && dayEntry.time !== 'لا يوجد موعد.';
        }


        /**
         * Parses the full schedule string to isolate ONLY the schedule for the specified day.
         *
         * @param {string} fullSchedule - The complete schedule string.
         * @param {string} day - The Arabic name of the day (e.g., 'الأحد').
         * @returns {string} - The schedule slice for that day, or the full schedule if combined entry, or 'لا يوجد'.
         */
        function extractDaySchedule(fullSchedule, day) {
            const parsedSchedule = parseScheduleToDays(fullSchedule);
            const dayEntry = parsedSchedule.find(entry => entry.day === day);
            
            if (dayEntry && dayEntry.time !== 'لا يوجد موعد.') {
                return `${dayEntry.day}: ${dayEntry.time}`;
            }

            return 'لا يوجد موعد محدد لهذا اليوم.';
        }
        
        /**
         * Checks if the full schedule contains more than just the current day's single entry.
         * @param {string} fullSchedule - The complete schedule string.
         * @param {string} day - The Arabic name of the day.
         * @returns {boolean}
         */
        function isMultiDaySchedule(fullSchedule, day) {
            // Check if the full schedule string contains any day other than the current day.
            const otherDays = daysOfWeek.filter(d => d !== day);
            return otherDays.some(d => fullSchedule.includes(d));
        }

        // --- UI Initialization and Rendering ---

        function initFilters() {
            // 1. Populate Specialty Dropdown
            const specialtyFilter = document.getElementById('specialty-filter');
            const uniqueSpecialties = getUniqueSpecialties();

            uniqueSpecialties.forEach(specialty => {
                const option = document.createElement('option');
                option.value = specialty;
                option.textContent = specialty;
                specialtyFilter.appendChild(option);
            });

            // 2. Set initial filter to current day
            const currentDay = getCurrentDayInArabic();
            selectedDay = currentDay; 

            // Set initial filter title to reflect the current day filter
            document.getElementById('day-filter-title').textContent = `عيادات اليوم (${currentDay}):`;

            // Initial render: filter by current day immediately
            filterSchedule();
        }

        /**
         * Toggles the display of the full weekly schedule versus just the current day's schedule.
         * @param {string} id - The unique ID prefix for the schedule elements (e.g., 'schedule-0').
         */
        function toggleFullSchedule(id) {
            const currentScheduleEl = document.getElementById(`${id}-day`);
            const fullScheduleEl = document.getElementById(`${id}-full`);
            const toggleButton = document.getElementById(`${id}-toggle`);
            
            if (fullScheduleEl.classList.contains('hidden')) {
                // Switch to full schedule (structured grid)
                currentScheduleEl.classList.add('hidden');
                fullScheduleEl.classList.remove('hidden');
                toggleButton.textContent = 'إخفاء جدول المواعيد';
                toggleButton.classList.remove('text-primary-indigo');
                toggleButton.classList.add('text-red-600');
            } else {
                // Switch back to day schedule
                fullScheduleEl.classList.add('hidden');
                currentScheduleEl.classList.remove('hidden');
                toggleButton.textContent = 'إظهار جدول المواعيد الأسبوعي المفصل';
                toggleButton.classList.remove('text-red-600');
                toggleButton.classList.add('text-primary-indigo');
            }
        }
        
        function filterSchedule() {
            // Use the un-modified search term from the input field
            const searchTerm = document.getElementById('doctor-search').value.trim(); 
            
            // Normalize the search term once for robust comparison
            const normalizedSearchTerm = normalizeArabicSearch(searchTerm);

            const specialty = document.getElementById('specialty-filter').value;
            const resultsContainer = document.getElementById('schedule-results');
            const noResults = document.getElementById('no-results');
            
            // --- CRITICAL FIX: Determine day filter based on search/specialty ---
            let dayFilterToApply;
            
            if (searchTerm !== '') {
                // FIX: If user is searching by name, force 'all' days to find the doctor regardless of the current day.
                dayFilterToApply = 'all'; 
            } else if (specialty !== 'all') {
                // If filtering by specialty but not searching, show all days for that specialty.
                dayFilterToApply = 'all';
            } else {
                // Default: Filter by current day when no search term and no specialty is selected.
                dayFilterToApply = getCurrentDayInArabic();
            }
            // -------------------------------------------------------------------

            // Update the day title to reflect the current filtering mode
            const dayTitle = document.getElementById('day-filter-title');
            if (searchTerm !== '') {
                 dayTitle.textContent = `نتائج البحث عن ${searchTerm}: (كل أيام الأسبوع)`;
            } else if (specialty !== 'all') {
                dayTitle.textContent = `نتائج التصفية لتخصص ${specialty}: (كل أيام الأسبوع)`;
            } else {
                dayTitle.textContent = `عيادات اليوم (${getCurrentDayInArabic()}):`;
            }

            let filteredData = clinicsData.filter(clinic => {
                // Filter 1: Specialty
                const specialtyMatch = specialty === 'all' || clinic.specialty === specialty;

                // Filter 2: Day of Week 
                const dayMatch = hasDay(clinic.schedule, dayFilterToApply);
                
                // Filter 3: Doctor Name Search 
                const doctorName = clinic.doctor; 
                // Normalize the doctor name for comparison
                const normalizedDoctorName = normalizeArabicSearch(doctorName);
                
                // Check if search term is empty OR if the normalized doctor name includes the normalized search term.
                const searchMatch = searchTerm === '' || 
                    normalizedDoctorName.includes(normalizedSearchTerm);

                return specialtyMatch && dayMatch && searchMatch;
            });

            // Render Results
            resultsContainer.innerHTML = '';

            if (filteredData.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                
                filteredData.forEach((clinic, index) => {
                    // Determine if the card should initially show 'all' days (if searched or filtered by specialty)
                    const dayToShow = (searchTerm !== '' || specialty !== 'all') ? 'all' : getCurrentDayInArabic();
                    const card = createClinicCard(clinic, dayToShow, index);
                    resultsContainer.appendChild(card);
                });
            }
        }

        function createClinicCard(clinic, displayMode, clinicIndex) {
            const card = document.createElement('div');
            card.className = 'bg-white p-4 md:p-6 rounded-xl shadow-xl transition-all hover:shadow-2xl border-r-8 border-primary-indigo md:flex md:gap-6 items-start';
            
            const notesContent = clinic.notes ? 
                `<p class="text-sm mt-3 text-red-600 p-2 bg-red-50 rounded-lg border-r-2 border-red-400">
                    <span class="font-bold">ملاحظات:</span> ${clinic.notes}
                </p>` : '';

            // --- Schedule Logic ---
            const uniqueId = `schedule-${clinicIndex}`;
            const fullScheduleText = clinic.schedule;
            // The display mode is 'all' if filtering by specialty OR if searching by name
            const isFullScheduleDisplay = displayMode === 'all';

            // 1. Prepare Single-Day/Filtered Schedule Content (The default visible part)
            const dayScheduleText = isFullScheduleDisplay ? fullScheduleText : extractDaySchedule(fullScheduleText, displayMode);
            
            // 2. Prepare Detailed Weekly Schedule Content (The collapsible part)
            const weeklyScheduleArray = parseScheduleToDays(fullScheduleText);
            let weeklyScheduleHTML = `
                <div class="weekly-schedule-grid text-sm border border-gray-300 rounded-lg overflow-hidden">
                    <div class="grid-header">اليوم</div>
                    <div class="grid-header">المواعيد</div>
            `;
            
            // Filter out days with "لا يوجد موعد." before rendering the grid
            const availableDays = weeklyScheduleArray.filter(item => item.time !== 'لا يوجد موعد.');

            if (availableDays.length > 0) {
                availableDays.forEach(item => {
                    // Highlight the current day ONLY if we are NOT in full schedule mode (meaning we are viewing today's default list)
                    const isToday = item.day === getCurrentDayInArabic();
                    const highlightClass = isToday && !isFullScheduleDisplay ? 'bg-primary-teal text-white' : '';
                    
                    weeklyScheduleHTML += `
                        <div class="grid-day ${highlightClass}">${item.day}</div>
                        <div class="grid-time ${highlightClass} ${item.time.includes('لا يوجد') ? 'text-gray-500' : 'font-semibold'}">${item.time}</div>
                    `;
                });
            } else {
                 // Should not happen if filteredData is non-empty, but for safety:
                 weeklyScheduleHTML += `<div class="col-span-2 text-center py-4 text-gray-500">لا يوجد مواعيد مسجلة لهذا الطبيب.</div>`;
            }
            
            weeklyScheduleHTML += `</div>`;


            // 3. Determine visibility and button text
            const showToggleButton = !isFullScheduleDisplay && isMultiDaySchedule(fullScheduleText, displayMode);
            
            const scheduleHTML = `
                <!-- Schedule displayed initially (Today's schedule or full string if filtered by specialty/search) -->
                <div id="${uniqueId}-day" class="schedule-text text-md leading-relaxed p-2 bg-light-blue rounded-lg border-2 border-primary-teal custom-scroll overflow-x-auto whitespace-nowrap">
                    ${dayScheduleText}
                </div>
                <!-- Detailed Weekly Schedule (Hidden by default unless filtered by specialty/search) -->
                <div id="${uniqueId}-full" class="p-2 ${isFullScheduleDisplay ? '' : 'hidden'}">
                    <p class="text-sm font-semibold mb-2 text-gray-700">جدول الأسبوع التفصيلي:</p>
                    ${weeklyScheduleHTML}
                </div>
            `;
            
            const finalToggleButtonHTML = showToggleButton ? 
                `<button id="${uniqueId}-toggle" 
                    onclick="toggleFullSchedule('${uniqueId}')"
                    class="mt-2 text-sm font-semibold text-primary-indigo hover:text-primary-teal transition duration-150 focus:outline-none">
                    إظهار جدول المواعيد الأسبوعي المفصل
                </button>` : '';
            
            const initialHeading = isFullScheduleDisplay ? 'جدول المواعيد لجميع الأيام' : 'موعد اليوم المحدد:';


            card.innerHTML = `
                <!-- Specialty & Doctor Info (Left/Top) -->
                <div class="md:w-1/3 flex-shrink-0 border-b md:border-b-0 md:border-l md:pl-6 pb-4 md:pb-0 mb-4 md:mb-0">
                    <p class="text-3xl mb-2">${clinic.emoji}</p>
                    <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-snug">د. ${clinic.doctor}</h3>
                    <p class="text-primary-teal font-semibold text-lg mt-1">${clinic.specialty}</p>
                    <div class="mt-3 text-lg font-bold text-accent-orange">
                        ${clinic.fee} <span class="text-sm">ج.م</span>
                    </div>
                </div>

                <!-- Schedule & Notes (Right/Bottom) -->
                <div class="md:w-2/3">
                    <div class="flex items-center text-gray-700 mb-2">
                        <span class="text-2xl ml-2">🕒</span>
                        <p class="font-medium">${initialHeading}</p>
                    </div>
                    
                    ${scheduleHTML}
                    ${finalToggleButtonHTML}

                    ${notesContent}
                </div>
            `;

            // Correct initial display state based on filter
            const dayEl = card.querySelector(`#${uniqueId}-day`);
            const fullEl = card.querySelector(`#${uniqueId}-full`);

            // We must re-select elements after setting innerHTML
            if(dayEl && fullEl) {
                if (isFullScheduleDisplay) {
                    // If filtered by specialty or searching, show the full structured schedule
                    dayEl.classList.add('hidden');
                    fullEl.classList.remove('hidden');
                } else {
                    // If filtering by day, show the single-day view
                    dayEl.classList.remove('hidden');
                    fullEl.classList.add('hidden');
                }
            }
            
            return card;
        }

        // Initialize the app when the window loads
        window.onload = initFilters;
    </script>
</body>
</html>
